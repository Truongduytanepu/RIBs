name: RIBS
options:
  bundleIdPrefix: test.RIBS
  postGenCommand: pod install
packages:
  RxSwift:
    url: https://github.com/ReactiveX/RxSwift
    from: "6.9.0"

targets:
  RIBS:
    type: application
    platform: iOS
    deploymentTarget: "15.6"
    sources: [RIBS]
    info:
      path: RIBS/Info.plist
      properties:
        CFBundleIdentifier: test.RIBS
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleExecutable: $(EXECUTABLE_NAME)

    settings:
      base:
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
